name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: seat_reservation
          POSTGRES_USER: seat
          POSTGRES_PASSWORD: seat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seat -d seat_reservation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify against PostgreSQL
        run: ./mvnw -B verify -Ppostgres-it
        env:
          DB_URL: jdbc:postgresql://localhost:5432/seat_reservation
          DB_USER: seat
          DB_PASSWORD: seat
          TEST_DB_URL: jdbc:postgresql://localhost:5432/seat_reservation
          TEST_DB_USER: seat
          TEST_DB_PASSWORD: seat
          JWT_SECRET: 0123456789abcdef0123456789abcdef
      - name: Burst smoke against running API
        env:
          DB_URL: jdbc:postgresql://localhost:5432/seat_reservation
          DB_USER: seat
          DB_PASSWORD: seat
          JWT_SECRET: 0123456789abcdef0123456789abcdef
        run: |
          java -jar target/seat-reservation-at-scale-0.1.0-SNAPSHOT.jar > "$RUNNER_TEMP/seat-api.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health/ready > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/health/ready
          admin_jwt=$(python3 scripts/mint_admin_jwt.py)
          java scripts/Burst.java http://127.0.0.1:8080 "$admin_jwt" 24 --smoke
      - name: Build Docker image
        run: docker build -t seat-reservation:ci .
