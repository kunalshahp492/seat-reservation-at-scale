name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: seat_reservation
          POSTGRES_USER: seat
          POSTGRES_PASSWORD: seat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seat -d seat_reservation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify against PostgreSQL
        run: ./mvnw -B verify -Ppostgres-it
        env:
          DB_URL: jdbc:postgresql://localhost:5432/seat_reservation
          DB_USER: seat
          DB_PASSWORD: seat
          TEST_DB_URL: jdbc:postgresql://localhost:5432/seat_reservation
          TEST_DB_USER: seat
          TEST_DB_PASSWORD: seat
